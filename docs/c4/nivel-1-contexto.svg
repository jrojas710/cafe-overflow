<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#707070"/></marker></defs><rect width="1100" height="820" fill="#ffffff"/><text x="40" y="44" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#1b1b1b" text-anchor="start">Nivel 1 · Diagrama de Contexto del Sistema — Café Overflow</text><text x="40" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#666" text-anchor="start">Quién usa el sistema y qué hace con él. Pagos simulados: no hay sistemas externos en el alcance del taller.</text><text x="40" y="700" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#444" text-anchor="start">Leyenda</text><rect x="40" y="712" width="26" height="16" rx="3" fill="#08427B" stroke="#073B6F"/><text x="74" y="724" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">Persona</text><rect x="40" y="736" width="26" height="16" rx="3" fill="#1168BD" stroke="#0B4884"/><text x="74" y="748" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">Sistema de software (en alcance)</text><line x1="40" y1="768" x2="66" y2="768" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><text x="74" y="772" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">Relación / dependencia</text><line x1="330" y1="305" x2="450" y2="465" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><line x1="770" y1="305" x2="650" y2="465" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><circle cx="300" cy="139.0" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><rect x="150.0" y="155.0" width="300" height="150" rx="34" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><text x="300" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Cliente desarrollador</text><text x="300" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Persona]</text><text x="300" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Desarrollador que visita el café. Pide</text><text x="300" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">desde su mesa o para llevar, paga y</text><text x="300" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">acumula DevPoints.</text><circle cx="800" cy="139.0" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><rect x="650.0" y="155.0" width="300" height="150" rx="34" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><text x="800" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Barista / Personal</text><text x="800" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Persona]</text><text x="800" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Empleado del café. Registra pagos en</text><text x="800" y="261.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">barra, prepara y entrega pedidos y</text><text x="800" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">mantiene el inventario.</text><rect x="340.0" y="465.0" width="420" height="190" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="1.5"/><text x="550" y="530.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Café Overflow</text><text x="550" y="549.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Sistema de software]</text><text x="550" y="572.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Aplicación web para gestionar el menú, procesar pedidos,</text><text x="550" y="587.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">calcular descuentos dinámicos por nivel (Junior/Mid/Senior) y</text><text x="550" y="602.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">administrar el programa de lealtad DevPoints.</text><rect x="248.1" y="345.0" width="191.8" height="66" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="344.0" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Consulta el menú, cotiza,</text><text x="344.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">registra y paga pedidos;</text><text x="344.0" y="389.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">consulta su nivel y DevPoints</text><text x="344.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[HTTPS / navegador]</text><rect x="663.2" y="345.0" width="185.6" height="66" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="756.0" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Avanza el estado de los</text><text x="756.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">pedidos y actualiza el stock</text><text x="756.0" y="389.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">del menú</text><text x="756.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[HTTPS / navegador]</text></svg>