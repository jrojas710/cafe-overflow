<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" width="1200" height="1180"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#707070"/></marker></defs><rect width="1200" height="1180" fill="#ffffff"/><text x="40" y="44" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#1b1b1b" text-anchor="start">Nivel 2 · Diagrama de Contenedores — Café Overflow</text><text x="40" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#666" text-anchor="start">Unidades desplegables y cómo se comunican. Se corresponden con los 3 niveles físicos (tiers) del modelo N-Tier.</text><text x="860" y="900" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#444" text-anchor="start">Leyenda</text><rect x="860" y="912" width="26" height="16" rx="3" fill="#08427B" stroke="#073B6F"/><text x="894" y="924" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">Persona</text><rect x="860" y="936" width="26" height="16" rx="3" fill="#438DD5" stroke="#3C7FC0"/><text x="894" y="948" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">Contenedor</text><line x1="860" y1="968" x2="886" y2="968" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><text x="894" y="972" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">Relación / dependencia</text><rect x="80" y="320" width="1040" height="820" rx="6" fill="none" stroke="#444" stroke-width="1.4" stroke-dasharray="8,5"/><text x="94" y="1110" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#444" text-anchor="start">Café Overflow</text><text x="94" y="1127" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">[Sistema de software]</text><rect x="110" y="346" width="123.6" height="22" rx="11" fill="#1168BD" fill-opacity="0.12" stroke="#1168BD" stroke-width="1"/><text x="171.8" y="362" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1168BD" text-anchor="middle">Tier 1 · Cliente</text><rect x="110" y="626" width="222.6" height="22" rx="11" fill="#1168BD" fill-opacity="0.12" stroke="#1168BD" stroke-width="1"/><text x="221.3" y="642" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1168BD" text-anchor="middle">Tier 2 · Servidor de aplicación</text><rect x="110" y="886" width="110.39999999999999" height="22" rx="11" fill="#1168BD" fill-opacity="0.12" stroke="#1168BD" stroke-width="1"/><text x="165.2" y="902" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1168BD" text-anchor="middle">Tier 3 · Datos</text><line x1="400" y1="262" x2="520" y2="360" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><line x1="800" y1="262" x2="680" y2="360" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><line x1="540" y1="520" x2="540" y2="605" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><line x1="660" y1="605" x2="660" y2="520" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><line x1="600" y1="775" x2="600" y2="870" stroke="#707070" stroke-width="1.4" stroke-dasharray="7,4" marker-end="url(#punta)"/><circle cx="380" cy="124.0" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><rect x="240.0" y="140.0" width="280" height="120" rx="34" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><text x="380" y="181.5" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Cliente desarrollador</text><text x="380" y="200.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Persona]</text><text x="380" y="223.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Hace y paga pedidos; consulta su</text><text x="380" y="238.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">lealtad.</text><circle cx="820" cy="124.0" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><rect x="680.0" y="140.0" width="280" height="120" rx="34" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/><text x="820" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Barista / Personal</text><text x="820" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Persona]</text><text x="820" y="231.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Gestiona la barra y el inventario.</text><rect x="390.0" y="360.0" width="420" height="160" rx="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/><text x="600" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Aplicación web (SPA)</text><text x="600" y="429.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Contenedor: HTML5, CSS3, JavaScript ES Modules — navegador]</text><text x="600" y="452.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Cliente liviano: renderiza menú, carrito, mis pedidos, barra e</text><text x="600" y="467.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">inventario. Solo valida sintaxis; todos los cálculos se los</text><text x="600" y="482.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">pide a la API.</text><rect x="390.0" y="605.0" width="420" height="170" rx="10" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/><text x="600" y="660.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Servidor de aplicación / API REST</text><text x="600" y="679.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Contenedor: Node.js 22 + node:http, sin frameworks]</text><text x="600" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Expone la API JSON y sirve los archivos del cliente web.</text><text x="600" y="717.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Organizado en 3 capas lógicas: Presentación → Negocio →</text><text x="600" y="732.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">Persistencia.</text><path d="M410.0,884.0 L410.0,1006.0 A190.0,14 0 0 0 790.0,1006.0 L790.0,884.0 A190.0,14 0 0 0 410.0,884.0 Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/><ellipse cx="600" cy="884.0" rx="190.0" ry="14" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/><text x="600" y="930.5" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Almacén de datos</text><text x="600" y="949.5" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#ffffff" text-anchor="middle">[Contenedor: archivos JSON en disco]</text><text x="600" y="972.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">productos.json · clientes.json · pedidos.json. Se crean</text><text x="600" y="987.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#ffffff" text-anchor="middle">desde semillas en el primer arranque.</text><rect x="380.3" y="284.2" width="55.4" height="36" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="408.0" y="298.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Usa</text><text x="408.0" y="313.2" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[HTTPS]</text><rect x="764.3" y="284.2" width="55.4" height="36" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="792.0" y="298.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Usa</text><text x="792.0" y="313.2" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[HTTPS]</text><rect x="309.6" y="538.0" width="160.8" height="51" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="390.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Llama a la API (cotizar,</text><text x="390.0" y="567.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">registrar, avanzar…)</text><text x="390.0" y="582.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[JSON / HTTP · fetch]</text><rect x="715.8" y="545.5" width="148.4" height="36" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="790.0" y="559.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Entrega HTML, CSS y JS</text><text x="790.0" y="574.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[HTTP]</text><rect x="331.7" y="805.5" width="216.6" height="36" rx="4" fill="#ffffff" fill-opacity="0.92"/><text x="440.0" y="819.5" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle">Lee y escribe registros</text><text x="440.0" y="834.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="italic" fill="#555" text-anchor="middle">[fs/promises · escritura atómica]</text></svg>